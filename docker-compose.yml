# API and web only — Postgres is **Supabase** (URLs in `.env.local`).
# Copy `.env.local.example` → `.env.local` and set `DATABASE_URL` (pooled) + `DIRECT_URL` (direct).

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      CORS_ORIGINS: http://localhost:3000,http://web:3000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 45s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
