# API and web only — Postgres is **Supabase** (URLs in `.env.local`).
# Copy `.env.local.example` → `.env.local` and set `DATABASE_URL` (pooled) + `DIRECT_URL` (direct).

services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address :9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

  mlflow:
    image: python:3.12-slim-bookworm
    ports:
      - "5555:5555"
    volumes:
      - ./mlflow-data:/data
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # API connects as Host: mlflow:5555 — must allow Docker service name + port
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    command: >
      sh -c "pip install --no-cache-dir 'mlflow>=2.14.0' boto3 &&
             mlflow server --host 0.0.0.0 --port 5555
               --backend-store-uri sqlite:////data/mlflow.db
               --default-artifact-root s3://mlflow"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5555/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      CORS_ORIGINS: http://localhost:3000,http://web:3000
      MLFLOW_TRACKING_URI: http://mlflow:5555
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
