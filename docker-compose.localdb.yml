# Optional: local Postgres 16 for offline / parity testing.
# Usage: `docker compose -f docker-compose.yml -f docker-compose.localdb.yml up --build`
# Point `.env.local` at `postgresql://postgres:postgres@db:5432/music` for both `DATABASE_URL` and `DIRECT_URL`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
